# WaxPrep Quality Gate — permanent automatic checks on every push and pull request.
# Core format/lint/type/test verification is make check (single source of truth).
# Additional CI-only checks: package import validation and dependency audit.
# This workflow is the judge: it never rewrites code.

name: quality-gate

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      UV_INDEX_URL: https://pypi.org/simple
      UV_HTTP_TIMEOUT: "120"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Install Python and project dependencies
        run: |
          uv python install 3.14
          uv sync --group dev --frozen

      - name: make check
        run: make check

      - name: Package import validation
        env:
          PYTHONPATH: src
        run: |
          uv run python -c "import waxprep"
          uv run python -c "from waxprep.config import Settings, load_settings"

      - name: Dependency vulnerability audit
        run: |
          uv export --frozen --no-emit-project --group dev -o /tmp/waxprep-all-reqs.txt
          uvx --from pip-audit pip-audit -r /tmp/waxprep-all-reqs.txt
