[project]
name = "waxprep"
version = "0.1.0"
license = { text = "Apache-2.0" }
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.9",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
