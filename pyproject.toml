[project]
name = "waxprep"
version = "0.1.0"
license = { text = "Apache-2.0" }
requires-python = ">=3.14,<3.15"
dependencies = [
    "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.9",
    "types-jsonschema",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "Use waxprep.clock.Clock instead of direct wall-clock access."
"time.time_ns".msg = "Use waxprep.clock.Clock instead of direct wall-clock access."
"time.monotonic".msg = "Use waxprep.clock.Clock instead of direct monotonic time access."
"time.monotonic_ns".msg = "Use waxprep.clock.Clock instead of direct monotonic time access."
"time.perf_counter".msg = "Use waxprep.clock.Clock instead of direct elapsed-time access."
"time.perf_counter_ns".msg = "Use waxprep.clock.Clock instead of direct elapsed-time access."

[tool.ruff.lint.per-file-ignores]
"src/waxprep/clock.py" = ["TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
